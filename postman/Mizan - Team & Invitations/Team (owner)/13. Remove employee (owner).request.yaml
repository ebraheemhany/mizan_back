$kind: http-request
url: "{{baseUrl}}/api/users/{{employeeId}}"
method: DELETE
headers:
  Authorization: Bearer {{ownerAccessToken}}
scripts:
  - type: afterResponse
    code: pm.test('204 No Content (now run 8 → 401)', () => pm.response.to.have.status(204));
    language: text/javascript
order: 4000
