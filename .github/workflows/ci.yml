name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mizan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway values for CI only; the real ones live in .env on each machine.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mizan_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mizan_test?schema=public
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Also runs "prisma generate" through the postinstall script.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
